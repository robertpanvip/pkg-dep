name: Release

# 触发方式（两种）：
#   1) 打 tag：推送形如 v1.2.3 的 tag 自动触发
#   2) 手动：在仓库 Actions 页点 “Run workflow”，填写版本号后运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.0.0），仅在手动运行时使用'
        required: true
        default: '0.1.0'

# 创建 GitHub Release 需要 contents: write 权限
permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布插件
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (JetBrains)
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '17'

      # 无需 Rust 工具链：依赖图 SVG 由 Apache Batik（纯 Java）光栅化，跨平台无需原生编译。

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 打 tag 触发：从 tag 名去掉前缀 v
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # 手动触发：使用输入版本
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # -Pversion：让产物版本号与 tag / 手动输入的版本保持一致
      - name: Clean previous distributions
        shell: bash
        # 清除历史遗留的旧命名 zip（如 plugin-*.zip），避免被 *.zip 通配误发布
        run: rm -rf plugin/build/distributions

      - name: Build plugin
        # 必须用 bash 调用 gradlew（sh 脚本），不要用默认的 PowerShell 调 gradlew.bat：
        # PowerShell 把 `-Pversion=0.1.0` 这类含等号/点的参数传给 .bat 时会拆坏，
        # 导致 Gradle 误把 `0.1.0` 当成任务名而报 “Task '.1.0' not found”。
        shell: bash
        run: ./gradlew :plugin:buildPlugin -Pversion="${{ steps.version.outputs.value }}" --no-daemon --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: plugin/build/distributions/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
